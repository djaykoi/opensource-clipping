[project]
name = "opensource-clipping"
version = "1.12.0"
description = "AI Auto-Clipper & Teaser Generator — converts long videos into viral short-form clips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]",
    "faster-whisper",
    "google-genai",
    "mediapipe",
    "opencv-python",
    "Pillow",
    "requests",
    "python-dotenv",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "ultralytics",
    "gdown",
]

[project.scripts]
clipping = "main:main"

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Only real errors (syntax errors, undefined names) — no style rules.
select = ["E9", "F63", "F7", "F82"]
